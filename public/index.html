<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صمّم رداءك</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#222;font-family:Arial,Tahoma,sans-serif}header{background:#171513;color:#f3dfad;text-align:center;padding:22px;position:sticky;top:0}main{max-width:950px;margin:auto;padding:20px}.card{background:white;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 8px 30px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}button{padding:13px;border:1px solid #ddd;background:#fff;border-radius:14px;font-size:15px}button:hover{border-color:#a77b3c}.primary{background:#9b7437;color:#fff;border:0;font-size:19px;padding:16px 28px}.hidden{display:none}.back{background:#eee}.bar{height:8px;background:#a77b3c;width:0;border-radius:8px}.track{background:#eee;border-radius:8px}.preview{width:100%;max-height:800px;object-fit:contain;background:#f7f3ec;border-radius:18px}</style><header><h1>صمّم رداءك ✨</h1><div>لوحة أزياء بالذكاء الاصطناعي</div></header><main><section id="start" class="card"><h2>اختر قطعة الملابس</h2><div id="g" class="grid"></div></section><section id="quiz" class="card hidden"><button class="back" onclick="back()">رجوع</button><div class="track"><div id="bar" class="bar"></div></div><h2 id="qt"></h2><div id="op" class="grid"></div></section><section id="finish" class="card hidden"><h2>مواصفات التصميم</h2><div id="sum"></div><button class="primary" onclick="go()">إنشاء التصميم ✨</button><p id="st"></p><img id="im" class="preview hidden"></section></main><script>
const gs=["بلوزة","قميص","توب","كورسيه","تونيك","بودي سوت","بلوفر","سويت شيرت","هودي","بنطلون جينز","بنطلون قماش","بنطلون واسع","ليجنز","برمودا","شورت","تنورة","فستان كاجوال","فستان سهرة","فستان زفاف","فستان كوكتيل","فستان ماكسي","جمبسوت","رومبر","جاكيت","بليزر","كارديجان","معطف طويل","بيجاما","روب","لانجيري","طقم رياضي","مايوه","بكيني","بوركيني","عباءة","جلابية","إسدال صلاة","حجاب"];
const qs=[["style","أسلوب التصميم",["أنيقة","كلاسيكية","راقية","سمارت كاجوال","كاجوال","بوهو","فينتج","مونوكروم","رياضية","ستريت وير"]],["pattern","النقشة",["سادة","مخطط","زهور","هندسي","مجرد","كاروهات","بيزلي","منقط","ألوان متداخلة","تاي داي"]],["fit","القصّة",["منتظمة","فضفاضة","أوفر سايز","ضيقة","مستقيمة","واسعة"]],["neckline","الرقبة",["V","دائرية","مربعة","قارب","قلب","أوف شولدر","هالتر","ياقة قميص","ياقة عالية","بدون ياقة"]],["sleeves","الأكمام",["عادية","واسعة","كيمونو","بالون","منفوخة","جرس","كاب","بدون أكمام"]],["sleeveLength","طول الكم",["طويلة","ثلاثة أرباع","قصيرة","نصف كم","بدون أكمام"]],["length","الطول",["قصير","كروب","منتظم","ميدي","طويل","ماكسي"]],["waist","الخصر",["مرتفع","منخفض","متوسط","مطاطي","رباط","كورسيت","بدون خصر"]],["leg","الجزء السفلي",["مستقيم","سكيني","واسع","بوت كت","مدبب","A-line","قلم رصاص","ميرميد","غير مطبق"]],["fabric","الخامة",["قطن","كتان","حرير","ساتان","شيفون","دانتيل","كريب","تول","صوف","دينم","مخمل","جلد","جاكار","جيرسي"]],["color","اللون",["أسود","أبيض","رمادي","بيج","بني","أحمر","وردي","أزرق","أخضر","بنفسجي","ذهبي","فضي","باستيل"]],["details","التفاصيل",["أزرار","سحاب","جيوب","كشكش","دانتيل","تطريز","ترتر","خرز","لؤلؤ","أحزمة","ثنيات","فتحات","سلاسل معدنية","بدون إضافات"]]];
let s={garment:"",i:0,a:{}};const g=document.querySelector("#g");gs.forEach(x=>{let b=document.createElement("button");b.textContent=x;b.onclick=()=>{s.garment=x;s.i=0;s.a={};start();};g.appendChild(b)});
function start(){startEl.classList.add("hidden");quiz.classList.remove("hidden");show()}const startEl=document.querySelector("#start"),quiz=document.querySelector("#quiz"),finish=document.querySelector("#finish");
function show(){let q=qs[s.i];qt.textContent=q[1];op.innerHTML="";bar.style.width=(s.i/qs.length*100)+"%";q[2].forEach(x=>{let b=document.createElement("button");b.textContent=x;b.onclick=()=>{s.a[q[0]]=x;s.i++;s.i<qs.length?show():done()};op.appendChild(b)})}
function back(){if(s.i){s.i--;show()}else{quiz.classList.add("hidden");startEl.classList.remove("hidden")}}
function done(){quiz.classList.add("hidden");finish.classList.remove("hidden");sum.innerHTML="<b>القطعة:</b> "+s.garment+"<br>"+qs.map(q=>"<b>"+q[1]+":</b> "+s.a[q[0]]).join("<br>")}
async function go(){st.textContent="⏳ جاري إنشاء لوحة التصميم…";im.classList.add("hidden");try{let r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({garment:s.garment,...s.a})});let d=await r.json();im.src=d.image;im.classList.remove("hidden");st.textContent=d.ai?"✨ تم إنشاء التصميم بالذكاء الاصطناعي":"⚠️ مولّد الصور غير متاح الآن؛ تم عرض لوحة فورية."}catch(e){st.textContent="حدث خطأ في الاتصال."}}
</script></html>
